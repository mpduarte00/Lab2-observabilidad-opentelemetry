
apiVersion: v1
kind: Pod
metadata:
  name: stress-test
spec:
  restartPolicy: Never
  containers:
    - name: stress-test
      image: ubuntu:24.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y stress-ng &&
          stress-ng --cpu 1 --timeout 30s --metrics-brief
      resources:
        requests:
          cpu: "50m"
          memory: "256Mi"
        limits:
          cpu: "250m"
          memory: "512Mi"
